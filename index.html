const GROUPS=RAW.trim().split('\n').map((line,index)=>{let [words,clues]=line.split(';');return {id:index,words:words.split('|').map(w=>w.trim().toUpperCase()),clues:clues.split(',').map(w=>w.trim())}});
const ALL=GROUPS.flatMap(g=>g.words);
if(GROUPS.length!==50||ALL.length!==200||new Set(ALL).size!==200)throw new Error('La base ne contient pas 200 mots distincts');
const $=s=>document.querySelector(s),scene=$('#scene'),layer=$('#layer');
const state={phase:'home',round:0,score:0,correct:0,best:0,consecutive:0,solution:'',words:[],pairs:[],clues:[],removed:new Set(),deadline:0,raf:0,timer:0,showTimeout:0,nextTimeout:0,last:null,chaosTimer:0};
try{state.best=Number(localStorage.getItem('sixseven-best')||0)}catch(e){}
function shuffle(input){const a=[...input];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function choose(a){return a[Math.floor(Math.random()*a.length)]}
function clearJobs(){clearTimeout(state.showTimeout);clearTimeout(state.nextTimeout);cancelAnimationFrame(state.raf);clearInterval(state.timer);clearInterval(state.chaosTimer);state.showTimeout=state.nextTimeout=state.raf=state.timer=state.chaosTimer=0}
function level(){return state.round<=3?{time:12,mult:1,name:'DÉCOUVERTE'}:state.round<=6?{time:10,mult:2,name:'SPEED ×2'}:state.round<=9?{time:8,mult:3,name:'SPEED ×3'}:{time:8,mult:4,name:'CHAOS ×4'}}
function stats(){ $('#round').textContent=state.round;$('#score').textContent=state.score}
function display(html){scene.innerHTML=html}
function startHome(){clearJobs();layer.innerHTML='';document.querySelector('.phone').classList.remove('chaos');state.phase='home';state.round=0;state.score=0;state.correct=0;stats();display(`<section class="view home-view"><div class="tag">Le jeu de déduction express</div><div class="hero-logo"><div class="six">SIX</div><div class="seven">SEVEN</div></div><p class="slogan"><b>6</b> mots à éliminer. <em>1</em> seul à sauver.</p><h1 class="heading" style="font-size:clamp(27px,5vh,40px)">3 indices. 7 mots.<br><em>Un seul survivant.</em></h1><p class="desc">Chaque indice désigne <strong>2 mots à éliminer</strong>. Élimine les 6 mots associés avant la fin du chrono !</p><div class="intro-bottom"><button class="cta" id="play">JOUER <span aria-hidden="true">➜</span></button><div class="mini-rules"><span>⚡ 2 s / indice</span><span>⏱ 12 → 8 s</span><span>🔥 Chaos dès 10</span></div><div class="small">Meilleur score : <strong>${state.best} pts</strong></div></div></section>`);$('#play').onclick=()=>{state.round=0;state.score=0;state.correct=0;startRound()}}
function pickRound(){const groups=shuffle(GROUPS).slice(0,4);const [a,b,c,d]=groups;const cluesUsed=new Set();const pairs=[a,b,c].map(g=>{const options=g.clues.filter(clue=>!cluesUsed.has(clue.toLocaleLowerCase('fr')));const clue=choose(options.length?options:g.clues);cluesUsed.add(clue.toLocaleLowerCase('fr'));return {words:shuffle(g.words).slice(0,2),clue,group:g.id}});const target=choose(d.words);return {pairs,target,words:shuffle([target,...pairs.flatMap(p=>p.words)])}}
function startRound(){clearJobs();layer.innerHTML='';document.querySelector('.phone').classList.remove('chaos');state.phase='clue';state.round++;state.removed=new Set();const puzzle=pickRound();state.solution=puzzle.target;state.words=puzzle.words;state.pairs=puzzle.pairs;state.clues=puzzle.pairs.map(p=>p.clue);stats();if([4,7,10].includes(state.round))showTransition();else showClue(0)}
function showTransition(){const l=level();display(`<section class="view"><div class="tag">NIVEAU ${state.round}</div><div class="transition-symbol">${l.mult===4?'⚡':'🚀'}</div><h1 class="heading"><em>${l.name}</em></h1><p class="desc">${l.time} secondes par manche<br><strong>Bonus ×${l.mult}</strong>${l.mult===4?'<br>Les cartes se mettent à vibrer !':''}</p></section>`);state.showTimeout=setTimeout(()=>showClue(0),1250)}
function showClue(idx){if(state.phase!=='clue')return;display(`<section class="view"><div class="tag">MANCHE ${state.round} · MÉMORISATION</div><h1 class="heading" style="font-size:clamp(27px,5vh,42px)">Retiens les <em>indices</em></h1><div class="step-dots">${[0,1,2].map(i=>`<span class="dot ${i<idx?'done':i===idx?'current':''}"></span>`).join('')}</div><div class="clue-stage"><div class="clue-card"><small>INDICE ${idx+1} / 3</small><div class="clue-word"></div><div class="hint">2 mots à éliminer</div></div><div class="clue-progress"><i id="cp"></i></div></div><p class="mutedline">L'indice disparaît après 2 secondes</p></section>`);$('.clue-word').textContent=state.clues[idx];const t0=performance.now();function anim(t){if(state.phase!=='clue')return;const p=Math.max(0,1-(t-t0)/2000);const bar=$('#cp');if(bar)bar.style.transform=`scaleX(${p})`;if(p>0)state.raf=requestAnimationFrame(anim);else{const word=$('.clue-word');if(word)word.textContent='••••••';state.showTimeout=setTimeout(()=>idx===2?showBoard():showClue(idx+1),120)}}state.raf=requestAnimationFrame(anim)}
function showBoard(){clearJobs();state.phase='guess';state.deadline=performance.now()+level().time*1000;document.querySelector('.phone').classList.toggle('chaos',state.round>=10);renderBoard();if(state.round>=10)startChaos();tick()}
function boardHtml(revealed=false){const remaining=state.words.filter(w=>!state.removed.has(w));return `<div class="board-wrap ${revealed?'finished':''}"><div class="board-head"><div class="tag">${revealed?'SOLUTION':`MANCHE ${state.round} · DÉDUCTION`}</div><h1>${revealed?'Le mot cible était…':'Trouve le mot intrus'}</h1><p>${revealed?'Voici les associations de cette manche':'Élimine 6 mots · chaque indice en désigne 2'}</p></div>${revealed?'':`<div class="clockline"><span>⏱ ${level().name} · ×${level().mult}</span><span class="timeleft" id="time">${level().time},0 s</span></div><div class="timerbar"><div class="timerfill" id="tf"></div></div>`}<div class="words">${state.words.map(w=>`<button type="button" data-word="${w}" class="word ${state.removed.has(w)?'out':''} ${remaining.length===1&&remaining[0]===w?'last':''} ${revealed&&w===state.solution?'correct':''}" ${revealed||state.removed.has(w)?'disabled':''}>${w}</button>`).join('')}</div>${revealed?`<div class="feedback">${state.pairs.map(p=>`<div><b>${p.clue}</b> → ${p.words.join(' + ')}</div>`).join('')}</div><button class="cta footer-action" id="restart">REJOUER ➜</button>`:`<div class="bottomline">${remaining.length>1?`Encore <strong>${remaining.length-1}</strong> mot${remaining.length>2?'s':''} à éliminer`:'Le dernier mot est ta réponse !'}</div>`}</div>`}
function renderBoard(){display(boardHtml());scene.querySelectorAll('[data-word]:not([disabled])').forEach(el=>el.onclick=()=>removeWord(el.dataset.word))}
function startChaos(){clearInterval(state.chaosTimer);const pulse=()=>{if(state.phase!=='guess')return;const candidates=[...scene.querySelectorAll('.word:not(.out)')];scene.querySelectorAll('.word').forEach(e=>e.classList.remove('jitter'));if(candidates.length<2)return;const selected=shuffle(candidates).slice(0,2);selected.forEach(e=>e.classList.add('jitter'));setTimeout(()=>selected.forEach(e=>e.classList.remove('jitter')),260)};pulse();state.chaosTimer=setInterval(pulse,1100)}
function tick(){if(state.phase!=='guess')return;let left=Math.max(0,state.deadline-performance.now());const t=$('#time'),b=$('#tf');if(t){t.textContent=(left/1000).toFixed(1).replace('.',',')+' s';t.classList.toggle('danger',left<=3000)}if(b)b.style.transform=`scaleX(${left/(level().time*1000)})`;if(left<=0){lose('timeout',null);return}state.raf=requestAnimationFrame(tick)}
function removeWord(word){if(state.phase!=='guess'||state.removed.has(word))return;if(performance.now()>=state.deadline){lose('timeout',null);return}state.removed.add(word);const left=state.words.filter(w=>!state.removed.has(w));if(left.length===1){const answer=left[0];if(answer!==state.solution){lose('wrong',answer);return}win()}else{renderBoard()}}
function win(){let seconds=Math.max(0,state.deadline-performance.now());let base=Math.max(1,Math.ceil(seconds/1000));let points=base*level().mult;state.score+=points;state.correct++;state.phase='win';cancelAnimationFrame(state.raf);clearInterval(state.chaosTimer);document.querySelector('.phone').classList.remove('chaos');if(state.score>state.best){state.best=state.score;try{localStorage.setItem('sixseven-best',String(state.best))}catch(e){}}stats();display(`<section class="view"><div class="tag">MANCHE ${state.round} RÉUSSIE</div><div style="font-size:75px;margin:14px 0">✨</div><h1 class="heading" style="color:var(--lime)">BIEN JOUÉ !</h1><div class="result-number">+${points}</div><div class="result-sub">POINT${points>1?'S':''} · ${Math.max(0,seconds/1000).toFixed(1).replace('.',',')} s restantes ×${level().mult}</div><p class="desc">Le mot cible était <strong style="color:var(--lime)">${state.solution}</strong></p><button class="cta footer-action" id="advance">MANCHE SUIVANTE ➜</button></section>`);$('#advance').onclick=startRound;state.nextTimeout=setTimeout(()=>{if(state.phase==='win')startRound()},1350)}
function lose(reason,answer){state.phase='lost';cancelAnimationFrame(state.raf);clearInterval(state.chaosTimer);document.querySelector('.phone').classList.remove('chaos');state.last={reason,answer,solution:state.solution,round:state.round,score:state.score};layer.innerHTML=`<div class="overlay"><div class="modal"><div class="modal-icon">${reason==='timeout'?'⏱️':'💔'}</div><div class="tag">FIN DE PARTIE</div><h2>${reason==='timeout'?'TEMPS ÉCOULÉ !':'OUPS, RATÉ !'}</h2><p>${reason==='timeout'?'Le temps est écoulé.':'Le dernier mot n’était pas le mot cible.'}</p><div class="result-number">${state.score}</div><div class="result-sub">POINT${state.score>1?'S':''} · ${state.correct} MANCHE${state.correct>1?'S':''} RÉUSSIE${state.correct>1?'S':''}<br>Record : ${state.best} pts</div><button class="cta" id="okay">OK · VOIR LA RÉPONSE</button></div></div>`;$('#okay').onclick=review}
function review(){clearJobs();state.phase='review';document.querySelector('.phone').classList.remove('chaos');layer.innerHTML='';display(boardHtml(true));$('#restart').onclick=startHome}
startHome();
</script></body></html>
